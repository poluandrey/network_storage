version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network_storage_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydatabase
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: network_storage_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: network_storage
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
